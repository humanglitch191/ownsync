<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 370" width="880" height="370" font-family="Geist, system-ui, -apple-system, 'Segoe UI', sans-serif" role="img" aria-labelledby="t d">
<title id="t">How Ownsync works</title>
<desc id="d">Your laptop and phone each encrypt every edit and hold the vault key. Your own Cloudflare Worker relays and stores only scrambled data and can't read a note. A one-time QR code hands the key from one device to the next. The dashboard, signed in with a passkey, shows devices, conflicts and usage.</desc>
<style>
.card { fill: #ffffff; stroke: #e3e5e8; }
.ink { fill: #16181b; }
.muted { fill: #6b7079; }
.rule { stroke: #eef0f2; }
.flow { stroke: #9ea3ab; fill: none; }
.head { fill: #9ea3ab; }
.key { fill: #3a9a64; }
.dot { fill: #c3c6cb; }
.pill { fill: #f4f5f6; stroke: #e3e5e8; }
@media (prefers-color-scheme: dark) {
	.card { fill: #18191b; stroke: #26282b; }
	.ink { fill: #ebecee; }
	.muted { fill: #8a8f97; }
	.rule { stroke: #1f2124; }
	.flow { stroke: #5f646b; }
	.head { fill: #5f646b; }
	.key { fill: #5fbf88; }
	.dot { fill: #3d4148; }
	.pill { fill: #0f1011; stroke: #26282b; }
}
</style>
<defs>
<marker id="a" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L8 4 L0 8 z" class="head"/></marker>
</defs>

<!-- Adding a device: the key goes device to device, never through the server -->
<path d="M150 78 Q440 -10 730 78" class="flow" stroke-width="1.5" stroke-dasharray="5 5" marker-end="url(#a)"/>
<text x="440" y="24" text-anchor="middle" font-size="13" class="muted">Add a device: a one-time QR code hands over the key</text>

<!-- Laptop -->
<rect x="40" y="80" width="220" height="150" rx="14" class="card" stroke-width="1"/>
<text x="58" y="112" font-size="15" font-weight="600" class="ink">Your laptop</text>
<text x="58" y="132" font-size="12.5" class="muted">Obsidian + Ownsync</text>
<line x1="58" y1="148" x2="242" y2="148" class="rule" stroke-width="1"/>
<circle cx="63" cy="170" r="3.5" class="dot"/>
<text x="74" y="174" font-size="13" class="ink">Encrypts every edit</text>
<circle cx="63" cy="196" r="3.5" class="key"/>
<text x="74" y="200" font-size="13" class="ink">Holds the vault key</text>

<!-- Worker -->
<rect x="330" y="80" width="220" height="150" rx="14" class="card" stroke-width="1"/>
<text x="348" y="112" font-size="15" font-weight="600" class="ink">Your Cloudflare Worker</text>
<text x="348" y="132" font-size="12.5" class="muted">Free plan, your account</text>
<line x1="348" y1="148" x2="532" y2="148" class="rule" stroke-width="1"/>
<circle cx="353" cy="170" r="3.5" class="dot"/>
<text x="364" y="174" font-size="13" class="ink">Relays scrambled data</text>
<circle cx="353" cy="196" r="3.5" class="dot"/>
<text x="364" y="200" font-size="13" class="ink">Can't read a note</text>

<!-- Phone -->
<rect x="620" y="80" width="220" height="150" rx="14" class="card" stroke-width="1"/>
<text x="638" y="112" font-size="15" font-weight="600" class="ink">Your phone</text>
<text x="638" y="132" font-size="12.5" class="muted">Obsidian + Ownsync</text>
<line x1="638" y1="148" x2="822" y2="148" class="rule" stroke-width="1"/>
<circle cx="643" cy="170" r="3.5" class="dot"/>
<text x="654" y="174" font-size="13" class="ink">Decrypts as it arrives</text>
<circle cx="643" cy="196" r="3.5" class="key"/>
<text x="654" y="200" font-size="13" class="ink">Holds the vault key</text>

<!-- Encrypted edits, both ways -->
<line x1="266" y1="160" x2="324" y2="160" class="flow" stroke-width="1.5" marker-start="url(#a)" marker-end="url(#a)"/>
<text x="295" y="150" text-anchor="middle" font-size="11.5" class="muted">encrypted</text>
<line x1="556" y1="160" x2="614" y2="160" class="flow" stroke-width="1.5" marker-start="url(#a)" marker-end="url(#a)"/>
<text x="585" y="150" text-anchor="middle" font-size="11.5" class="muted">encrypted</text>

<!-- Dashboard -->
<line x1="440" y1="230" x2="440" y2="270" class="flow" stroke-width="1.5"/>
<rect x="330" y="270" width="220" height="70" rx="12" class="pill" stroke-width="1"/>
<text x="440" y="298" text-anchor="middle" font-size="14" font-weight="600" class="ink">Dashboard</text>
<text x="440" y="319" text-anchor="middle" font-size="12.5" class="muted">Passkey sign-in · devices, usage</text>

<!-- Legend -->
<circle cx="46" cy="320" r="3.5" class="key"/>
<text x="57" y="324" font-size="12.5" class="muted">The vault key exists only on your devices</text>
</svg>
