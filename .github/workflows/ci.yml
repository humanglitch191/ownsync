name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      WRANGLER_SEND_METRICS: "false"
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false # no token on disk while dependency install scripts run
      - uses: actions/setup-node@v7
        with:
          node-version: 26

      - name: Root manifest.json and versions.json match plugin/manifest.json
        run: node scripts/sync-manifest.mjs && git diff --exit-code manifest.json versions.json

      - name: Protocol
        working-directory: protocol
        run: npm test

      # The plugin's tests also run the Worker under wrangler dev, so the server is installed first.
      - name: Server
        working-directory: server
        run: |
          npm ci
          npm run typecheck
          npm test

      - name: Plugin
        working-directory: plugin
        run: |
          npm ci
          npm test
          npm run build
