name: Fuzz

# Engine and attachment-table fuzz tests, split by seed range. Every run covers new seeds.
# A failure prints its seed; replay it locally with FUZZ_SEED=<seed> using the same test file.

on:
  schedule:
    - cron: "23 3 * * *"
  workflow_dispatch:
    inputs:
      runs:
        description: Optional maximum runs per shard (blank uses the suite default)
      steps:
        description: Steps per run
        default: "250"

permissions:
  contents: read

jobs:
  ranges:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
    steps:
      - id: plan
        shell: python
        env:
          RUN_LIMIT: ${{ inputs.runs }}
        run: |
          import json
          import os

          # At 3.94 seconds per paired seed, a table shard takes about 82 of its 180 minutes.
          suites = [("table", 128, 1250), ("engine", 8, 20000)]
          total = sum(shards * width for _, shards, width in suites)
          first = int(os.environ["GITHUB_RUN_NUMBER"]) * total + 1
          limit = int(os.environ["RUN_LIMIT"]) if os.environ["RUN_LIMIT"] else None
          if limit is not None and limit < 1:
              raise ValueError("runs must be positive")
          jobs = []
          for suite, shards, width in suites:
              for shard in range(shards):
                  jobs.append(dict(suite=suite, shard=shard, first=first, runs=min(limit or width, width)))
                  first += width  # Reserve the full range even for a shortened manual run.
          with open(os.environ["GITHUB_OUTPUT"], "a") as out:
              print("matrix=" + json.dumps({"include": jobs}), file=out)

  fuzz:
    needs: ranges
    name: ${{ matrix.suite }} shard ${{ matrix.shard }}
    runs-on: ubuntu-latest
    timeout-minutes: 180
    # The legacy engine no longer ships as the sync path. Keep its fuzz results informational.
    continue-on-error: ${{ matrix.suite == 'engine' }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.ranges.outputs.matrix) }}
    env:
      FUZZ_FIRST: ${{ matrix.first }}
      FUZZ_RUNS: ${{ matrix.runs }}
      FUZZ_STEPS: ${{ inputs.steps || '250' }}
      SUITE: ${{ matrix.suite }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false # no token on disk while dependency install scripts run
      - uses: actions/setup-node@v7
        with:
          node-version: 26
      - name: Install
        working-directory: plugin
        run: npm ci
      - name: Fuzz one seed range
        working-directory: plugin
        run: |
          echo "seeds $FUZZ_FIRST to $(( FUZZ_FIRST + FUZZ_RUNS - 1 )), $FUZZ_STEPS steps each"
          node --import jiti/register --test "test/${SUITE}.fuzz.test.ts"
